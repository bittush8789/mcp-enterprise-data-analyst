version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: enterprise_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: enterprise_analytics
      MYSQL_USER: analyst
      MYSQL_PASSWORD: analyst_secure_pwd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: enterprise_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=enterprise_analytics
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - SEMANTIC_WEIGHT=${SEMANTIC_WEIGHT:-0.6}
      - KEYWORD_WEIGHT=${KEYWORD_WEIGHT:-0.4}
      - TOP_K=${TOP_K:-5}
      - MAX_ROWS=${MAX_ROWS:-1000}
      - QUERY_TIMEOUT=${QUERY_TIMEOUT:-10}
    volumes:
      - .:/app

volumes:
  mysql_data:
  chroma_data:
